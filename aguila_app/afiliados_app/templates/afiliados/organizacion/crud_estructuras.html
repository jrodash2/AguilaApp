{% extends 'afiliados/base.html' %}
{% block content %}
<div class="page-body"><div class="container-fluid">
  <h4>{{ entity_label|title }}</h4>
  <div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Guardar</button>
    </form>
  </div></div>
  <div class="card"><div class="card-body table-responsive">
    <table class="display datatable"><thead><tr><th>ID</th><th>Registro</th><th>Acciones</th></tr></thead><tbody>
      {% for item in items %}
      <tr><td>{{ item.id }}</td><td>{{ item }}</td><td><a href="{% url edit_name item.id %}">Editar</a></td></tr>
      {% endfor %}
    </tbody></table>
  </div></div>
</div></div>
{% endblock %}
